services:
  - type: web
    name: lecture-navigator
    runtime: python
    plan: free
    buildCommand: uv sync --locked
    startCommand: uv run --locked uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: YTRAG_COLLECTION
        value: my_course_v2
      - key: YTRAG_EMBED_MODEL
        value: all-MiniLM-L6-v2
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
