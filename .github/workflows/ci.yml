name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      # The checked-in lockfile predates the FastEmbed deployment backend.
      # Resolve from pyproject.toml until uv.lock is regenerated locally.
      - run: uv sync
      - run: uv pip install "pytest>=8.3,<9"
      - run: uv run --no-sync pytest -q
